name: UI Tests - On Demand

on:
  repository_dispatch:
    types: [run-ui-tests]

jobs:
  ui-tests-ondemand:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Offline, no browser or API call: fails fast on an alias gap or a contradictory config.
      - name: Run guard suites
        run: npm run test:guards

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Fetch Fresh Basecamp Token
        run: |
          TOKEN=$(curl -s --header 'x-api-key: a0dd64d9-3c6c-462b-8be3-4d1381659d4b' --header 'x-basecamp-token-key: 11b067c5-649a-49b8-a76d-85c740524db9' https://py-api.hobbo.ai/internal/basecamp/access-token | jq -r '.access_token // empty')
          if [ -n "$TOKEN" ]; then
            echo "BASECAMP_TOKEN=$TOKEN" >> $GITHUB_ENV
            echo "::add-mask::$TOKEN"
            echo "Successfully retrieved fresh Basecamp token"
          else
            echo "Warning: Could not fetch Basecamp token from Hobbo API, falling back to secret"
          fi

      - name: Run On-Demand Validation
        run: node runners/runApiValidation.ondemand.js
        env:
          WIDGET_DATA: '${{ toJson(github.event.client_payload) }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          BASECAMP_TOKEN: '${{ env.BASECAMP_TOKEN || secrets.BASECAMP_TOKEN }}'
          BASECAMP_ACCOUNT_ID: '4294983'
          BASECAMP_PROJECT_ID: '19240348'
          BASECAMP_CHAT_ID: '7605911660'
          BASECAMP_CARD_COLUMN_ID: '5478412224'
          BASECAMP_CARD_ASSIGNEE_ID: '45133799'
          GITHUB_SERVER_URL: '${{ github.server_url }}'
          GITHUB_REPOSITORY: '${{ github.repository }}'
          GITHUB_RUN_ID: '${{ github.run_id }}'



      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: reports/
          retention-days: 30